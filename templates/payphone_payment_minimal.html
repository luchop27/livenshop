<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prueba PayPhone Cajita</title>
    <link rel="stylesheet" href="https://cdn.payphonetodoesposible.com/box/v2.0/payphone-payment-box.css">
    <script src="https://cdn.payphonetodoesposible.com/box/v2.0/payphone-payment-box.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: #f5f7fb;
            color: #111827;
        }
        .wrap {
            max-width: 860px;
            margin: 0 auto;
            background: #fff;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
        }
        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }
        .meta {
            margin: 0 0 18px;
            color: #4b5563;
            line-height: 1.7;
        }
        #pp-button {
            margin-top: 20px;
        }
        #debug {
            margin-top: 18px;
            padding: 12px 14px;
            background: #f3f4f6;
            border-radius: 10px;
            color: #111827;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 24px;
        }
        .hint {
            margin-top: 14px;
            font-size: 14px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <main class="wrap">
        <h1>Prueba PayPhone Cajita</h1>
        <p class="meta">
            Pedido #{{ pedido.id }}<br>
            Monto: ${{ pedido.total }}
        </p>

        <div id="pp-button"></div>
        <div id="debug"></div>
        <div class="hint">Esta página no carga jQuery, Bootstrap ni scripts del sitio.</div>
    </main>

    <script>
    window.addEventListener("DOMContentLoaded", () => {
        const debug = document.getElementById("debug");

        console.log("DOM cargado");
        console.log("PPaymentButtonBox:", typeof PPaymentButtonBox);
        console.log("Token existe:", Boolean("{{ payphone_token }}"));
        console.log("StoreId existe:", Boolean("{{ payphone_store_id }}"));
        console.log("ClientTransactionId:", "{{ client_transaction_id }}");
        console.log("Amount:", {{ amount }});

        try {
            const ppb = new PPaymentButtonBox({
                token: "{{ payphone_token|escapejs }}",
                clientTransactionId: "{{ client_transaction_id|escapejs }}",
                amount: {{ amount }},
                amountWithoutTax: {{ amount_without_tax }},
                amountWithTax: {{ amount_with_tax }},
                tax: {{ tax }},
                service: {{ service }},
                tip: {{ tip }},
                currency: "USD",
                storeId: "{{ payphone_store_id|escapejs }}",
                reference: "{{ reference|escapejs }}",
                lang: "es",
                defaultMethod: "card",
                timeZone: -5
            });

            ppb.render("pp-button");
            console.log("PayPhone render ejecutado");
            debug.innerHTML = "Render PayPhone ejecutado.";
        } catch (error) {
            console.error("ERROR RENDER PAYPHONE:", error);
            debug.innerHTML = "ERROR RENDER PAYPHONE:\n" + error;
        }
    });
    </script>
</body>
</html>
